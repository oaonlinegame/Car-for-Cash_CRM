<!DOCTYPE html>
<html>

<body>
    <h3>📁 ระบบสำรองข้อมูล + ทดสอบข้อความเขียนไฟล์</h3>

    <button onclick="pickFolder()">เลือกโฟลเดอร์ครั้งแรก</button>
    <button onclick="simulateData()">จำลองข้อมูลตัวอย่าง</button>
    <button onclick="backupNow()">สำรองข้อมูลลงไฟล์</button>

    <p><b>พิมพ์ข้อความทดสอบ (จะถูกเขียนลงไฟล์):</b></p>
    <textarea id="userText" rows="4" style="width:100%;max-width:500px;"></textarea>

    <h4>ข้อมูลจำลอง:</h4>
    <pre id="preview" style="background:#f0f0f0;padding:10px;border-radius:6px;"></pre>

    <script>
        let db;
        let simulatedData = [];   // เก็บข้อมูลจำลอง

        // ------------------------------
        // เปิด IndexedDB
        // ------------------------------
        async function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("backup-folder-db", 1);
                req.onupgradeneeded = e => {
                    db = e.target.result;
                    db.createObjectStore("handles");
                };
                req.onsuccess = e => { db = e.target.result; resolve(); };
                req.onerror = reject;
            });
        }

        function saveDirHandle(handle) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction("handles", "readwrite");
                tx.objectStore("handles").put(handle, "backupDir");
                tx.oncomplete = resolve;
                tx.onerror = reject;
            });
        }

        function loadDirHandle() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction("handles", "readonly");
                const req = tx.objectStore("handles").get("backupDir");
                req.onsuccess = () => resolve(req.result);
                req.onerror = reject;
            });
        }


        // ------------------------------
        // ปุ่มเลือกโฟลเดอร์ครั้งแรก
        // ------------------------------
        async function pickFolder() {
            await openDB();

            const dirHandle = await window.showDirectoryPicker();
            const perm = await dirHandle.requestPermission({ mode: "readwrite" });

            if (perm !== "granted") {
                alert("ไม่ได้รับสิทธิ์เขียนโฟลเดอร์");
                return;
            }

            await saveDirHandle(dirHandle);
            alert("เลือกโฟลเดอร์สำเร็จ! ครั้งต่อไปจะเขียนไฟล์อัตโนมัติ");
        }



        // ------------------------------
        // ปุ่มจำลองข้อมูล
        // ------------------------------
        function simulateData() {
            simulatedData = [];

            for (let i = 1; i <= 3; i++) {
                simulatedData.push({
                    id: i,
                    name: "ลูกค้าทดสอบ #" + i,
                    phone: "08x-xxx-xxxx",
                    timestamp: new Date().toISOString()
                });
            }

            document.querySelector("#preview").textContent =
                JSON.stringify(simulatedData, null, 2);
        }



        // ------------------------------
        // ปุ่มสำรองข้อมูลลงไฟล์
        // ------------------------------
        async function backupNow() {
            await openDB();
            const dirHandle = await loadDirHandle();

            if (!dirHandle) {
                alert("ยังไม่เคยเลือกโฟลเดอร์");
                return;
            }

            // ตรวจสิทธิ์
            let perm = await dirHandle.queryPermission({ mode: "readwrite" });
            if (perm !== "granted") {
                perm = await dirHandle.requestPermission({ mode: "readwrite" });
                if (perm !== "granted") {
                    alert("ไม่มีสิทธิ์เขียนโฟลเดอร์");
                    return;
                }
            }

            // ข้อความที่ผู้ใช้พิมพ์
            const userMessage = document.getElementById("userText").value;

            // ชื่อไฟล์ backup
            const fileHandle = await dirHandle.getFileHandle("lead-backup.json", { create: true });
            const writable = await fileHandle.createWritable();

            // payload ที่จะถูกเขียนลงไฟล์
            const payload = {
                backupTime: new Date().toISOString(),
                customMessage: userMessage,      // <— เพิ่มข้อความตรงนี้
                totalLeads: simulatedData.length,
                leads: simulatedData
            };

            await writable.write(JSON.stringify(payload, null, 2));
            await writable.close();

            alert("เขียนไฟล์เรียบร้อย! ลองเปิดดูว่ามีข้อความล่าสุดของคุณหรือไม่");
        }


        // โหลด DB ทันทีเมื่อเปิดหน้าเว็บ
        openDB();
    </script>
</body>

</html>
